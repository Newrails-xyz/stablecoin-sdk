name: Release

on:
  push:
    branches:
      - main

# Run only one release per branch at a time so concurrent runs can't clobber the "Version Packages" PR
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # let changesets push the version commit and create git tags
      pull-requests: write # let changesets open/update the "Version Packages" PR
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm CLI >= 11.5.1; the runner's bundled version may be older
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          # When changesets are pending: run this to produce the "Version Packages" PR
          version: npm run version-packages
          # After that PR merges (no pending changesets): build and publish in dependency order
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly enable provenance; no NPM_TOKEN needed under OIDC
          NPM_CONFIG_PROVENANCE: true
